name: Dockhand API Schema Sync

on:
  schedule:
    - cron: '0 5 * * *'  # Täglich 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Nötig ab hier (vorher lief dieser Workflow ohne npm ci -- extract-dockhand-api.mjs
        # und validate-mcp-tools.mjs brauchen nur node-Builtins): validate-mcp-tools.mjs
        # ruft jetzt intern `npx tsx scripts/collect-tool-shapes.mjs` auf (Task P1.4/P1.6),
        # das echte Tool-Registrierungscode importiert (zod, @modelcontextprotocol/sdk) --
        # ohne installierte node_modules würde dieser Subprozess fehlschlagen und die
        # Body-Contract-Checks stillschweigend übersprungen (advisory-Fallback, siehe
        # loadToolBodyShapes()) statt tatsächlich zu laufen.
        run: npm ci

      - name: Extract Dockhand API Schema
        run: node scripts/extract-dockhand-api.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ ! -f docs/dockhand-api-schema.json ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Kein Schema vorhanden — Initiale Extraktion"
          elif ! git diff --quiet docs/dockhand-api-schema.json; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Schema hat sich geändert"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine Änderungen"
          fi

      - name: Commit schema update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dockhand-api-schema.json
          git commit -m "chore(api): update Dockhand API schema (automated)"
          git push

      - name: Fetch Dockhand OpenAPI body-contract spec
        # Body-Contract-Quelle für Task P1.4 (scripts/lib/openapi-contract-source.mjs) --
        # hält docs/dockhand-openapi.json aktuell mit dem gepinnten Commit auf
        # strausmann/dockhand#feat/openapi-refresh (siehe scripts/fetch-openapi.mjs für die
        # Pinning-Begründung; ein Update auf einen neueren Commit ist ein bewusster,
        # separater Schritt, kein automatisches "immer der aktuelle Branch-Head").
        run: node scripts/fetch-openapi.mjs

      - name: Check for openapi spec changes
        id: openapi-changes
        run: |
          if ! git diff --quiet docs/dockhand-openapi.json; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "OpenAPI Body-Contract-Spec hat sich geändert"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine Änderungen"
          fi

      - name: Commit openapi spec update
        if: steps.openapi-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dockhand-openapi.json
          git commit -m "chore(api): update Dockhand OpenAPI body-contract spec (automated)"
          git push

      - name: Validate MCP tools against schema
        id: validate
        run: node scripts/validate-mcp-tools.mjs
        continue-on-error: true

      - name: Generate coverage doc
        # Läuft unabhängig davon, ob Validate kritische Mismatches gefunden hat (z.B.
        # ORPHANED_TOOL) — die Coverage-Übersicht (COVERED/MISSING_TOOL) ist davon
        # unabhängig und soll trotzdem aktuell bleiben.
        if: always()
        run: node scripts/generate-coverage-doc.mjs

      - name: Commit coverage doc update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/coverage.md; then
            git add docs/coverage.md
            git commit -m "docs(api): update API coverage report (automated)"
            git push
          else
            echo "docs/coverage.md unverändert — kein Commit"
          fi

      - name: Generate body-contract report
        # Task P1.4/P1.6, rein advisory: siehe generate-body-contract-doc.mjs Kopf-
        # kommentar. Läuft wie der Coverage-Schritt unabhängig vom Validate-Ergebnis --
        # die Findings-Übersicht soll auch dann aktuell bleiben, wenn Validate wegen
        # eines UNABHÄNGIGEN kritischen Mismatches (z.B. ORPHANED_TOOL) fehlschlägt.
        if: always()
        run: node scripts/generate-body-contract-doc.mjs

      - name: Commit body-contract report update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/body-contract-report.md; then
            git add docs/body-contract-report.md
            git commit -m "docs(api): update body-contract findings report (automated)"
            git push
          else
            echo "docs/body-contract-report.md unverändert — kein Commit"
          fi

      - name: Create issue on validation failure
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('validation-report.md')
              ? fs.readFileSync('validation-report.md', 'utf8')
              : 'Validation failed. Check workflow logs for details.';

            // Prüfe ob bereits ein offenes Issue existiert
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'api-change',
              state: 'open',
            });

            if (existing.data.length > 0) {
              // Update existierendes Issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `## Aktualisierter Report (${new Date().toISOString().split('T')[0]})\n\n${report}`,
              });
            } else {
              // Neues Issue erstellen
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[API Change]: Dockhand API Schema Mismatch (${new Date().toISOString().split('T')[0]})`,
                labels: ['api-change', 'priority: high', 'status: needs-triage'],
                body: `## Automatisch erkannte API-Änderung\n\nDer tägliche API-Schema-Sync hat Unterschiede zwischen der Dockhand API und unseren MCP-Tools erkannt.\n\n${report}\n\n### Nächste Schritte\n\n- [ ] Report analysieren\n- [ ] Betroffene MCP Tools identifizieren\n- [ ] Anpassungen implementieren\n- [ ] Tests aktualisieren`,
              });
            }

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.md
          if-no-files-found: ignore
