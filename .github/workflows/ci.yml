name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        run: npm run typecheck:tests

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Derived documents must match the code in the same commit. `docs/coverage.md` and
      # `src/openapi/tool-endpoint-map.ts` are generated from the tool registrations plus the
      # committed OpenAPI spec, but until now nothing checked them on a PR — they were only
      # refreshed by the nightly api-schema-sync run. Adding eight tools in #201 therefore
      # left docs/coverage.md advertising them as MISSING_TOOL, and a release cut before the
      # next nightly would have shipped that. Both generators are no-op-safe when nothing
      # changed, so regenerating and diffing is a clean gate.
      #
      # If this fails: run `npm run api:coverage-doc`, `npm run api:tool-endpoint-map` and
      # `node scripts/generate-body-contract-doc.mjs`, then commit the result.
      - name: Derived docs are in sync with the code
        run: |
          npm run api:coverage-doc
          npm run api:tool-endpoint-map
          node scripts/generate-body-contract-doc.mjs
          git diff --exit-code -- \
            docs/coverage.md \
            src/openapi/tool-endpoint-map.ts \
            docs/body-contract-report.md

      # Task #222 (mcp-dockhand#222 Task 5): the body-contract validator existed since
      # Task P1.4/P1.6 but only ran nightly in api-schema-sync.yml with
      # continue-on-error: true -- a body-contract drift introduced by a NEW Dockhand
      # release, or a tool change that drops a required body field, was never caught at
      # PR time, only surfaced (informationally) up to 24h later via the nightly issue.
      # This step closes that gap: it is the PR-blocking enforcer. It fails hard
      # (process.exit(1) in validate-mcp-tools.mjs, see hasCriticalErrors()) on
      # ORPHANED_TOOL / PARAM_MISMATCH / MISSING_ENCODE / QUERY_PARAM_UNKNOWN /
      # QUERY_PARAM_MISSING_REQUIRED / BODY_PARAM_MISSING_REQUIRED, and passes on
      # advisory-only findings (BODY_PARAM_UNKNOWN / UNTYPED_PASSTHROUGH /
      # BODY_CONTRACT_UNRESOLVED / MISSING_TOOL / CROSSREF_UNRESOLVED). No
      # continue-on-error here -- that is the whole point of this step.
      - name: Body-contract validation against Dockhand OpenAPI (hard gate)
        run: npm run api:validate

  docker:
    runs-on: ubuntu-latest
    needs: build
    # amd64-only smoke build. arm64 is built and verified on release.yml via a
    # native arm64 runner (build matrix), so emulating it here under QEMU is
    # redundant — and it repeatedly hung for ~6h until GitHub auto-cancelled the
    # job. timeout-minutes is a backstop against any future hang.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (amd64 smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lockfile-integrity:
    # Runs `npm ci` with the EXACT npm that ships in node:22-alpine — the image
    # the release Docker build uses. The `build` job's `npm ci` runs on the
    # runner's npm (a different patch), which validates lockfiles slightly
    # differently and let a broken lock reach main: v1.8.0-1.8.2 tagged but
    # produced no image (npm ci EUSAGE on conventional-commits-filter). No layer
    # cache here, so a stale layer cannot mask an install/ci inconsistency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: npm ci in production image (node:22-alpine)
        run: docker run --rm -v "$PWD":/app -w /app node:22-alpine npm ci --no-audit --no-fund

  lint:
    # ESLint itself is not installed from this repo's devDependencies -- see
    # scripts/lint-in-container.sh for why (TypeScript 7 vs. typescript-eslint).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint (containerized, TypeScript 5)
        run: bash scripts/lint-in-container.sh
